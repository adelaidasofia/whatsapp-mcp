[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "Python MCP server for whatsapp-mcp. Consumes the Go bridge REST API and exposes tools to Claude."
readme = "../README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [
    { name = "Adelaida Diaz-Roa" },
]

dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
    "unidecode>=1.3.8",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
