name: tests
# Broader test gate. Runs on every PR + push.
#
# Coverage:
#   - Go: every test in whatsapp-bridge (scrubber + normalize + aliases + future).
#     Broader than scrubber-eval.yml, which only triggers on scrubber file
#     changes. The aliases + normalize tests catch regressions on the LID/phone
#     JID merge code and accent-insensitive search.
#   - Python: every test under whatsapp-mcp-server/tests (scrub parity vs Go,
#     CRM lookup, phone normalizer). Pattern-count parity test fails CI if the
#     Python scrubber drifts from the Go one — both run in production and
#     drift is a security defect.
#
# Why not extend build.yml: build.yml is auto-managed by gh-harden-repos.sh
# and any hand-edit would be overwritten on next sync. This lives separately.
#
# Security note: this workflow does not consume any untrusted user-supplied
# fields (no issue/PR titles, branch names, commit messages, comment bodies).
# It runs go test + pytest against checked-in code only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    # Cross-platform gate (Mycelium cross-platform rule, MYC-3033): the bridge
    # must compile with CGO and pass its suite on Windows, macOS, and Linux.
    # The windows leg also runs keychain_windows_test.go against the real
    # Credential Manager — the proof the Windows key store works, not just
    # compiles. go-sqlcipher needs a C compiler: preinstalled clang/gcc on
    # macOS/Linux; MSYS2 UCRT64 gcc on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: 'stable'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put UCRT64 gcc on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Run go test
        working-directory: whatsapp-bridge
        shell: bash
        run: go test -v -count=1 ./...

  python:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
      - name: Install runtime + dev deps
        working-directory: whatsapp-mcp-server
        # uv sync is blocked by the parent-dir readme/license refs in
        # pyproject.toml (setuptools refuses to read outside the package root).
        # Install dependencies directly; tests don't need the package built.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'fastmcp>=3.2.4' \
            'httpx>=0.27.0' \
            'python-frontmatter>=1.1.0' \
            'unidecode>=1.3.8' \
            'pytest>=8.0' \
            'pytest-asyncio>=0.23'
      - name: Run pytest
        working-directory: whatsapp-mcp-server
        run: pytest tests/
