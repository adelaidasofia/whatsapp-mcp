name: tests
# Broader test gate. Runs on every PR + push.
#
# Coverage:
#   - Go: every test in whatsapp-bridge (scrubber + normalize + aliases + future).
#     Broader than scrubber-eval.yml, which only triggers on scrubber file
#     changes. The aliases + normalize tests catch regressions on the LID/phone
#     JID merge code and accent-insensitive search.
#   - Python: every test under whatsapp-mcp-server/tests (scrub parity vs Go,
#     CRM lookup, phone normalizer). Pattern-count parity test fails CI if the
#     Python scrubber drifts from the Go one — both run in production and
#     drift is a security defect.
#
# Why not extend build.yml: build.yml is auto-managed by gh-harden-repos.sh
# and any hand-edit would be overwritten on next sync. This lives separately.
#
# Security note: this workflow does not consume any untrusted user-supplied
# fields (no issue/PR titles, branch names, commit messages, comment bodies).
# It runs go test + pytest against checked-in code only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: 'stable'
      - name: Run go test
        working-directory: whatsapp-bridge
        run: go test -v -count=1 ./...

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
      - name: Install runtime + dev deps
        working-directory: whatsapp-mcp-server
        # uv sync is blocked by the parent-dir readme/license refs in
        # pyproject.toml (setuptools refuses to read outside the package root).
        # Install dependencies directly; tests don't need the package built.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'fastmcp>=3.2.4' \
            'httpx>=0.27.0' \
            'python-frontmatter>=1.1.0' \
            'unidecode>=1.3.8' \
            'pytest>=8.0' \
            'pytest-asyncio>=0.23'
      - name: Run pytest
        working-directory: whatsapp-mcp-server
        run: pytest tests/
